name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.9.0
        with:
          python-version: "3.11"

      - name: Install Python linting tools
        run: |
          pip install --upgrade pip
          pip install flake8 pylint

      - name: Lint Python scripts
        run: |
          find . -name "*.py" -not -path "*/__pycache__/*" -print0 | xargs -0 flake8 --max-line-length=120 --ignore=E501,W503,W504,E203,E266,W505 || true

      - name: ShellCheck lint
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./
          exclude: .git
          severity: warning

      - name: Check YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: '.github/workflows/*.yml'
          config_file: .yamllint
